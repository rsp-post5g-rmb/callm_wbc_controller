---
# Controller configuration for the CallmWbcController.
#
# MainRobot / Enabled are the keys mc_rtc reads to pick the main robot and the
# active controller. They are repeated here (as required by the task spec) but
# they only take effect from the global mc_rtc.yaml used to launch the framework,
# so make sure your run-time mc_rtc.yaml mirrors them:
#
#   MainRobot: UR5e
#   Enabled: CallmWbcController
#
# NOTE: MainRobot is the ARM module only. The controller does not use it directly as
# robot 0: robotModules() connects it onto the TriOrb base (and the gripper onto its
# tool) and hands MCController the merged module instead. See docs/connect_migration.md.
# The fixed `UR5e` variant is the honest choice now -- the arm has no floating base once
# it is bolted on -- but `UR5eFloatingBase` also works, since connect() drops the root
# joint of the module it attaches.
MainRobot: UR5e
Enabled: CallmWbcController

# ---- Robot assembly (connect) ----------------------------------------------
# Name of the merged robot module (TriOrb base + UR5e arm [+ Robotiq gripper]). This is
# the name of robot 0, so it is what the observer's `robot:` key and any interface config
# (e.g. mc_rtde's RTDE block) must refer to.
connect:
  name: callm

# ---- Whole-body task gains -------------------------------------------------
# Task keys are named after the part each task acts on:
#   callm_*  -- the whole merged robot
#   ur5e_*   -- the 6 arm joints only  (selectActiveJoints)
#   triorb_* -- the 3 base joints only (selectActiveJoints)
#   gripper_ -- the gripper's own joints only (selectActiveJoints)

# End-effector task ("Tool" surface). callm_ because the QP is free to reach the target
# with the base as much as with the arm -- that is the point of merging them.
callm_ee_task:
  stiffness: 5.0
  weight: 1000.0

# Base command task ("base" body). Drives base_x / base_y / base_yaw to reach the
# commanded planar pose.
triorb_base_task:
  stiffness: 2.0
  weight: 1000.0

# Arm posture task -- resolves arm redundancy in the callm_ee null space. This is
# mc_rtc's built-in postureTask, renamed and restricted to the 6 arm joints.
ur5e_posture:
  stiffness: 10.0
  weight: 5.0

# Base posture task -- light regularization of the base joints.
triorb_posture:
  stiffness: 1.0
  weight: 1.0

# Gripper posture task -- holds the knuckle joints of the connected gripper model. Only
# created when `gripper.simulate` is on. Its joints carry the "gripper_" prefix that the
# gripper connect() applies, hence the name.
gripper_posture:
  stiffness: 1.0
  weight: 1.0

# NOTE on damping: task damping is seeded critical (2*sqrt(stiffness)) for every task.
# There is no per-task YAML damping knob -- shape damping at runtime, per task, via the
# WbcData `task_damping_ratio` field: it is the damping ratio zeta when stiffness > 0
# (damping = 2*zeta*sqrt(stiffness), zeta=1 = critical), and the ABSOLUTE damping D when
# stiffness = 0 (a zero-stiffness task then acts as a pure velocity damper -- e.g.
# immobilize the base via triorb_posture; see docs/gains.md). mc_rtc has no generic
# "damping task" (mc_tasks::force::DampingTask is an admittance/force task).

# How the base is driven: "velocity" (active -- from velocity_base) or "pose"
# (inactive/overridable -- from the triorb_base target [world] GUI marker).
base_command:
  mode: velocity

# ---- Robotiq gripper -------------------------------------------------------
# Two INDEPENDENT switches:
#   simulate : CONNECT the gripper MODEL (a mc_robot_tools ConnectableRobotModule) onto
#              the arm's `tool0` link, so it becomes part of the merged robot. Its bodies,
#              joints and surfaces are given a "gripper_" prefix. If this is on and the
#              module cannot be loaded, construction FAILS loudly rather than silently
#              running without it.
#   command  : forward gripper_opening to the mc_robotiq GlobalPlugin datastore call
#              `RobotiqGripper::setOpening` (0 = open, 1 = closed) to drive the REAL
#              gripper. The plugin talks to it over a socket and moves no model joints, so
#              this does NOT need the model and works with simulate: false.
# Enable the RobotiqGripperPlugin in the global mc_rtc.yaml for the command path.
gripper:
  simulate: true                   # connect the mc_robot_tools gripper model
  model: Robotiq2f85Gripper        # or Robotiq2f140Gripper
  command: true                    # drive the real gripper via the plugin
  set_opening_call: "RobotiqGripper::setOpening"

# ---- ROS2 command client ---------------------------------------------------
# A WbcData message (std_msgs/Float64MultiArray, 32 doubles -- see WbcData.h) is
# received on command_topic and applied every loop; measured state is republished
# on measured_topic. The node spins on its own thread/context.
ros:
  node_name: callm_wbc_controller
  command_topic: "callm_wbc/command"
  measured_topic: "callm_wbc/measured"
  publish_measured: true
  publish_decimation: 10

# ---- State observation (Encoder + Visual Odometry) -------------------------
# The base STATE is grounded in realRobots() by the VisualOdometryObserver (VO), which
# subscribes to a geometry_msgs/PoseStamped topic and writes the base planar joints of the
# merged robot. Since connect() puts the arm in the SAME kinematic tree as the base, the
# observer's forwardKinematics() carries the arm too -- the old `attach` block that
# reconstructed the arm's floating base is gone (it only existed because a QP contact is
# not resolved for realRobots). The Encoder observer fills the arm joints. This makes
# realRobots() fully consistent. See docs/observer.md and docs/connect_migration.md.
ObserverPipelines:
  - name: CallmObservers
    gui: true
    log: true
    observers:
      - type: VisualOdometry     # merged robot's base planar joints from VO
        update: true
        gui: true
        # required: false -> load the controller even where the observer library is not
        # installed (e.g. the isolated smoke test); on hardware/superbuild it loads and
        # appears in the pipeline summary. A warning is logged if it is missing.
        required: false
        robot: callm            # the merged robot (see `connect.name` above)
        topic: "/robot_pose_slam"
        expected_frame_id: ""    # empty = skip header.frame_id check
        world_X_map:             # pose of the VO/map frame in the controller world
          translation: [0.0, 0.0, 0.0]
          rotation: [0.0, 0.0, 0.0]   # roll, pitch, yaw (rad); this rig zeroes map==world per episode
        height: 0.0
        planar: true
        timeout: 0.5             # s; older than this -> observer fails -> last pose held
        max_jump: 0.5            # m; larger step accepted (loop closure) but flagged; 0 = off
        planar_joints: [base_x, base_y, base_yaw]
      - type: Encoder            # arm joints from encoders
        update: true

# How the control robots consume realRobots() each tick (QP FeedbackType):
#   none           -> open loop (pure sim / no VO): base moves by QP velocity integration
#   joints         -> arm joints closed from encoders; base untouched
#   observed       -> full closed loop w.r.t realRobots (hardware); needs VO publishing
#   observed_real  -> as observed, integrating the real state (forces the v1 zero base vel)
# Left UNSET here (C++ default = none) so pure sim keeps working and the run config can
# select it: the merge order is global-config -> this controller yaml -> user config, so a
# key set here would OVERRIDE the run config. Set `feedback: observed` in your hardware
# run config (see etc/mc_rtde_callm.yaml), or in your user config, for closed loop.
# feedback: observed

# ---- Base-velocity export --------------------------------------------------
# The QP-realized base velocity is exported (body frame) to the TriorbBasePlugin via
# `command_key`. Set the plugin's `command_in_world_frame: false` to match. With no
# TriorbBasePlugin (pure RViZ sim) the export is inert.
base_state:
  command_key: "Triorb::cmd_velocity"

# ---- Arm <-> base collision avoidance --------------------------------------
# Keeps the listed UR5e links clear of the TriOrb base box. The "base" convex is
# auto-generated by mc_rtc from the URDF <box> collision (an sch::S_Box), so no
# hull file is required. base_link / shoulder_link are deliberately not listed:
# the arm base is rigidly mounted on the base and would otherwise be in permanent
# collision. Add "upper_arm_link" if you want fuller coverage.
arm_base_collision:
  enable: true
  iDist: 0.05   # distance at which avoidance starts engaging (m)
  sDist: 0.02   # minimum allowed separation (m)
  arm_links: [forearm_link, wrist_1_link, wrist_2_link, wrist_3_link]
